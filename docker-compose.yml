services:
  banking-quarkus:
    build: .
    container_name: banking-validation-container
    environment:
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-db-bank:5432/agencia
    ports:
      - "8181:8080"
    depends_on:
      - postgres-db-bank

  postgres-db-bank:
    image: postgres:14
    container_name: postgres-db-bank-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agencia
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql